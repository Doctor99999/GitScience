services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: gitscience-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker --timeout 120 --keep-alive 5 --forwarded-allow-ips='*' main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      # JWT подписи: обязателен в проде — впишите длинный случайный секрет
      # в дашборде Render (переменная создастся автоматически).
      - key: JWT_SECRET
        sync: false
      # HMAC-подпись fiat-вебхуков: обязателен в проде.
      - key: FIAT_WEBHOOK_SECRET
        sync: false
      # 1 = включить живое якорение в Bitcoin-календари OpenTimestamps
      - key: GITSCIENCE_OTS_LIVE
        sync: false

  # 2. Next.js Frontend Service
  - type: web
    name: gitscience-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
