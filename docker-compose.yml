version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gitscience_postgres
    restart: always
    environment:
      POSTGRES_USER: gitscience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gitscience_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitscience -d gitscience_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitscience_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: gitscience_fastapi
    restart: always
    environment:
      - DATABASE_URL=postgresql://gitscience:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/gitscience_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENVIRONMENT=production
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-gitscience-vault}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_REGION=${AWS_REGION:-auto}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    volumes:
      - vault_data:/app/storage

  worker:
    build: ./backend
    container_name: gitscience_celery_worker
    restart: always
    command: ["celery", "-A", "gitscience_celery", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql://gitscience:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/gitscience_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENVIRONMENT=production
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-gitscience-vault}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_REGION=${AWS_REGION:-auto}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    volumes:
      - vault_data:/app/storage

  frontend:
    container_name: gitscience_nextjs
    restart: always
    environment:
      # In production behind Nginx, frontend makes API calls to relative /api path
      - NEXT_PUBLIC_API_BASE=/api
      # WalletConnect: возьмите Project ID в cloud.walletconnect.com и пропишите в .env
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:?Set NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID in .env}
    depends_on:
      - backend
    networks:
      - frontend-net
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:?Set NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID in .env}

  nginx:
    build: ./nginx
    container_name: gitscience_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  vault_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge