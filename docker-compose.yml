version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gitscience_postgres
    restart: always
    environment:
      POSTGRES_USER: gitscience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123}
      POSTGRES_DB: gitscience_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitscience -d gitscience_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitscience_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-SuperSecretRedis123}
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SuperSecretRedis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: gitscience_fastapi
    restart: always
    environment:
      - DATABASE_URL=postgresql://gitscience:${POSTGRES_PASSWORD:-SuperSecretPassword123}@db:5432/gitscience_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SuperSecretRedis123}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-GS_DEV_SECRET_KEY_9999}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-gitscience-vault}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_REGION=${AWS_REGION:-auto}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    volumes:
      - vault_data:/app/storage

  worker:
    build: ./backend
    container_name: gitscience_celery_worker
    restart: always
    command: ["celery", "-A", "gitscience_celery", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql://gitscience:${POSTGRES_PASSWORD:-SuperSecretPassword123}@db:5432/gitscience_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-SuperSecretRedis123}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-GS_DEV_SECRET_KEY_9999}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-gitscience-vault}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    volumes:
      - vault_data:/app/storage

  frontend:
    build: ./frontend
    container_name: gitscience_nextjs
    restart: always
    environment:
      # In production behind Nginx, frontend makes API calls to relative /api path
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - frontend-net

  nginx:
    build: ./nginx
    container_name: gitscience_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    volumes:
      - nginx_certs:/etc/nginx/certs

volumes:
  postgres_data:
  redis_data:
  vault_data:
  nginx_certs:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge