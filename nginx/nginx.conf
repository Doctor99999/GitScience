user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 1. Защита от DDoS (Rate Limiting)
    # Зона api_limit: разрешает 10 запросов в секунду на 1 IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Зона conn_limit: разрешает не более 10 одновременных подключений на 1 IP.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    server_tokens off; # Скрытие версии Nginx
    client_max_body_size 50M; # Разрешаем загрузку PDF до 50 МБ

    upstream frontend_app {
        server frontend:3000;
    }
    
    upstream backend_api {
        server backend:8000;
    }
    
    server {
        listen 80;
        # В реальной среде здесь будет домен (напр., gitscience.org)
        server_name localhost gitscience.org www.gitscience.org;
        
        # 2. Глобальные Security Headers (OWASP)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # 3. Маршрутизация на Frontend (Next.js)
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Маршрутизация на Backend API (FastAPI) с Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Также перенаправляем сертификаты и эндпоинты документов на Backend
        location ~ ^/(certificate/pdf/|library/view/|download/) {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
